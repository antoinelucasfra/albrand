name: R-CMD-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # Quarto CLI for the render_report test (skipped locally if absent).
      # Pinned .deb, checksum-verified, dpkg-installed: runner images are
      # mid-migration and apt has a downgrade guard.
      - name: Install Quarto
        run: |
          wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.deb
          echo "98aad03c8ce11705caa7c48b8f6ea59f6ab02d1579e754ddb530c0f2e7b471c6  quarto-1.9.37-linux-amd64.deb" | sha256sum -c -
          sudo dpkg --force-downgrade -i quarto-1.9.37-linux-amd64.deb
          quarto --version
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
